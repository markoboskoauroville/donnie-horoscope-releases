# Publishes this site to Cloudflare Pages (https://donniehoroscope.pages.dev) on every push to main.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: donniehoroscope
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
          ls -la _site

      - name: Create the Pages project (first run only)
        run: npx --yes wrangler@3.114.0 pages project create "$PROJECT" --production-branch=main || echo "project exists"

      - name: Deploy
        run: npx --yes wrangler@3.114.0 pages deploy _site --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA::7}" --commit-dirty=true
